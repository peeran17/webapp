<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 12px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        button:hover {
            background: #5568d3;
        }

        .weather-info {
            display: none;
        }

        .weather-info.show {
            display: block;
        }

        .city-name {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
        }

        .weather-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .detail-box {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .detail-label {
            color: #666;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .detail-value {
            font-size: 28px;
            font-weight: bold;
            color: #667eea;
        }

        .error {
            color: red;
            text-align: center;
            padding: 20px;
            background: #ffe6e6;
            border-radius: 10px;
            display: none;
        }

        .error.show {
            display: block;
        }

        .weather-description {
            text-align: center;
            font-size: 18px;
            color: #666;
            margin-bottom: 20px;
            text-transform: capitalize;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌤️ Weather App</h1>
        
        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Enter city name...">
            <button id="searchBtn">Search</button>
        </div>

        <div class="error" id="error"></div>

        <div class="weather-info" id="weatherInfo">
            <div class="city-name" id="cityName"></div>
            <div class="weather-description" id="description"></div>
            
            <div class="weather-details">
                <div class="detail-box">
                    <div class="detail-label">Temperature</div>
                    <div class="detail-value" id="temperature"></div>
                </div>
                <div class="detail-box">
                    <div class="detail-label">Feels Like</div>
                    <div class="detail-value" id="feelsLike"></div>
                </div>
                <div class="detail-box">
                    <div class="detail-label">Humidity</div>
                    <div class="detail-value" id="humidity"></div>
                </div>
                <div class="detail-box">
                    <div class="detail-label">Wind Speed</div>
                    <div class="detail-value" id="windSpeed"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Get the HTML elements
        const cityInput = document.getElementById('cityInput');
        const searchBtn = document.getElementById('searchBtn');
        const weatherInfo = document.getElementById('weatherInfo');
        const errorDiv = document.getElementById('error');

        // API Key for weather data (Free API)
        const API_KEY = '8d5ff0a60d4af21ebd66af61cb4db1b5';

        // Function to fetch weather
        async function getWeather() {
            const city = cityInput.value.trim();

            // Check if user typed a city
            if (city === '') {
                showError('Please enter a city name!');
                return;
            }

            try {
                // Fetch data from the weather API
                const response = await fetch(
                    `https://api.openweathermap.org/data/2.5/weather?q=${city}&units=metric&appid=${API_KEY}`
                );

                // Check if request was successful
                if (!response.ok) {
                    throw new Error('City not found!');
                }

                // Convert response to JSON
                const data = await response.json();

                // Display the weather data
                displayWeather(data);
                hideError();

            } catch (error) {
                showError(error.message);
                hideWeatherInfo();
            }
        }

        // Function to display weather on page
        function displayWeather(data) {
            document.getElementById('cityName').textContent = 
                `${data.name}, ${data.sys.country}`;
            
            document.getElementById('temperature').textContent = 
                `${Math.round(data.main.temp)}°C`;
            
            document.getElementById('feelsLike').textContent = 
                `${Math.round(data.main.feels_like)}°C`;
            
            document.getElementById('humidity').textContent = 
                `${data.main.humidity}%`;
            
            document.getElementById('windSpeed').textContent = 
                `${data.wind.speed} m/s`;
            
            document.getElementById('description').textContent = 
                data.weather[0].main;

            weatherInfo.classList.add('show');
        }

        // Show error message
        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
        }

        // Hide error message
        function hideError() {
            errorDiv.classList.remove('show');
        }

        // Hide weather info
        function hideWeatherInfo() {
            weatherInfo.classList.remove('show');
        }

        // Listen for button click
        searchBtn.addEventListener('click', getWeather);

        // Allow Enter key to search
        cityInput.addEventListener('keypress', (event) => {
            if (event.key === 'Enter') {
                getWeather();
            }
        });
    </script>
</body>
</html>
